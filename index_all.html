<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>打掃工作分配表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="https://i.meee.com.tw/WKETfEq.jpg" type="image/x-icon" />
<style>
  :root{
    --paper:#f2f1ec;
    --ink:#22241f;
    --ink-soft:#5c5e57;
    --line:#d8d6cd;
    --card:#fbfaf7;
    --book-wind:#3f7ea6;
    --book-si:#3e8e73;
    --book-dawn:#d97e3d;
    --book-indigo:#4b4e93;
    --good:#2f8f5b;
    --warn:#b8860b;
    --bad:#b23b3b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  .board{
    max-width:520px;
    margin:0 auto;
    padding:20px 16px calc(120px + env(safe-area-inset-bottom));
  }
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:3px solid var(--ink);
    padding-bottom:12px;
    margin-bottom:14px;
  }
  .masthead h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.3px;
    margin:0;
    line-height:1;
  }
  .masthead .date{
    font-size:12.5px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }

  /* 頁籤樣式 */
  .nav-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 8px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    font-size: 13.5px;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all 0.2s ease;
    text-align: center;
  }
  .tab-btn.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
    font-weight: 600;
  }

  .who-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    margin-bottom:16px;
  }
  .who-box label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .who-current{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .who-current .info{font-size:13.5px;line-height:1.5;}
  .who-current .info b{font-weight:600;}
  .who-current .swap-btn{
    flex:none;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-size:12.5px;
    border-radius:99px;
    padding:6px 12px;
    cursor:pointer;
  }

  .select-trigger{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fff;
    padding:12px 14px;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
  }
  .select-trigger.placeholder{color:var(--ink-soft);}
  .trigger-arrow{
    flex:none;
    width:11px;height:11px;
    border-right:2px solid var(--ink-soft);
    border-bottom:2px solid var(--ink-soft);
    transform:rotate(45deg);
    margin-top:-4px;
  }

  .roster-strip{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:0 0 18px;
  }
  .roster-chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:99px;
    padding:5px 10px 5px 8px;
    font-size:12px;
  }
  .swatch{
    width:8px;height:8px;border-radius:2px;flex:none;
  }
  .roster-chip b{font-weight:600;}
  .roster-chip .who{color:var(--ink-soft);}

  .empty-hint{
    padding:36px 16px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    border:1px dashed var(--line);
    border-radius:10px;
  }

  .floor{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:10px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .floor-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 14px;
    border-bottom:1px solid var(--line);
  }
  .floor-num{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:34px;
    line-height:1;
    width:48px;
    flex:none;
    color:var(--ink);
  }
  .floor-meta{flex:1;min-width:0;}
  .floor-meta .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
  .book-tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11.5px;
    padding:2px 8px 2px 6px;
    border-radius:99px;
    color:#fff;
  }
  .book-tag .swatch{background:#fff;opacity:0.9;}
  .floor-meta .progress-line{
    font-size:12px;
    color:var(--ink-soft);
  }
  .progress-line strong{color:var(--ink);font-weight:600;}

  .progress-track{
    height:3px;
    background:var(--line);
  }
  .progress-fill{
    height:100%;
    background:var(--good);
    transition:width .25s ease;
  }

  .task-list{
    padding:4px 12px 12px;
  }
  .task-row{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:11px 8px;
    border-bottom:1px solid var(--line);
    border-radius:6px;
  }
  .task-row:last-of-type{border-bottom:none;}
  .task-row .label{
    font-size:14.5px;
  }
  .task-row.level-1{background:rgba(47,143,91,0.08);}
  .task-row.level-2{background:rgba(184,134,11,0.09);}
  .task-row.level-3{background:rgba(178,59,59,0.10);}

  .rate-trigger{
    align-self:flex-start;
    display:flex;
    align-items:center;
    gap:8px;
    border:1.5px solid var(--line);
    border-radius:99px;
    background:#fff;
    color:var(--ink-soft);
    font-size:13px;
    font-weight:500;
    padding:8px 12px;
    cursor:pointer;
  }
  .rate-trigger .trigger-arrow{
    border-color:currentColor;
    opacity:.7;
  }
  .task-row.level-1 .rate-trigger{border-color:var(--good);color:var(--good);background:rgba(47,143,91,0.08);}
  .task-row.level-2 .rate-trigger{border-color:var(--warn);color:var(--warn);background:rgba(184,134,11,0.09);}
  .task-row.level-3 .rate-trigger{border-color:var(--bad);color:var(--bad);background:rgba(178,59,59,0.10);}
  .rate-trigger:disabled{opacity:.6;cursor:default;}

  /* Bottom sheet */
  .sheet-backdrop{
    position:fixed;inset:0;
    background:rgba(20,20,16,0.4);
    opacity:0;pointer-events:none;
    transition:opacity .18s ease;
    z-index:90;
  }
  .sheet-backdrop.show{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    background:#fff;
    border-radius:16px 16px 0 0;
    box-shadow:0 -10px 30px rgba(0,0,0,.18);
    transform:translateY(100%);
    transition:transform .22s cubic-bezier(.2,.8,.3,1);
    z-index:100;
    max-height:72vh;
    overflow-y:auto;
    padding:10px 6px calc(14px + env(safe-area-inset-bottom));
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{
    width:36px;height:4px;
    background:var(--line);
    border-radius:99px;
    margin:4px auto 12px;
  }
  .sheet-title{
    font-size:13px;
    color:var(--ink-soft);
    padding:0 12px 8px;
  }
  .sheet-options{padding:0 6px;}
  .sheet-option{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:none;
    border:none;
    border-bottom:1px solid var(--line);
    text-align:left;
    padding:14px 10px;
    font-size:15.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .sheet-option:last-child{border-bottom:none;}
  .sheet-option.active{font-weight:600;color:var(--good);}
  .sheet-option .check-mark{color:var(--good);font-weight:700;}

  details.admin{
    margin-top:22px;
    border-top:1px solid var(--line);
    padding-top:12px;
  }
  details.admin summary{
    cursor:pointer;
    font-size:13px;
    color:var(--ink-soft);
    list-style:none;
  }
  details.admin summary::-webkit-details-marker{display:none;}
  .admin-body{
    margin-top:12px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.7;
  }
  .admin-body button{
    margin-top:8px;
    margin-right:6px;
    border:1px solid var(--ink-soft);
    background:#fff;
    color:var(--ink);
    border-radius:99px;
    padding:7px 12px;
    font-size:12.5px;
    cursor:pointer;
  }
  .admin-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:6px 0;
    border-bottom:1px solid var(--line);
  }
  .admin-row:last-child{border-bottom:none;}
  .loading{
    padding:50px 0 30px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }
  .loading-bar-track{
    width:160px;
    height:4px;
    margin:14px auto 0;
    background:var(--line);
    border-radius:99px;
    overflow:hidden;
  }
  .loading-bar-fill{
    width:40%;
    height:100%;
    background:var(--ink);
    border-radius:99px;
    animation:loading-slide 1.1s ease-in-out infinite;
  }
  @keyframes loading-slide{
    0%{ transform:translateX(-100%); }
    100%{ transform:translateX(250%); }
  }

  /* 底部固定送出列 */
  #submit-area{
    position:fixed;
    left:0;right:0;bottom:0;
    padding:10px 16px calc(14px + env(safe-area-inset-bottom));
    z-index:40;
  }
  .submit-box{
    max-width:520px;
    margin:0 auto;
    padding:14px 14px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:12px;
    box-shadow:0 -4px 18px rgba(0,0,0,.10);
    text-align:center;
  }
  .submit-box .hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .submit-btn{
    width:100%;
    border:none;
    border-radius:10px;
    padding:14px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    background:var(--ink);
    color:#fff;
  }
  .submit-btn:disabled{
    background:var(--line);
    color:var(--ink-soft);
    cursor:not-allowed;
  }
  .submit-progress-track{
    width:100%;
    height:10px;
    background:var(--line);
    border-radius:99px;
    overflow:hidden;
  }
  .submit-progress-fill{
    width:0%;
    height:100%;
    background:var(--good);
    border-radius:99px;
    transition:width .2s ease-out;
  }
  .submit-progress-pct{
    margin-top:8px;
    font-size:12px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .submitted-note{
    font-size:12.5px;
    color:var(--good);
    font-weight:600;
    margin-bottom:8px;
  }
  .footer-credits {
  text-align: center;
  font-size: 11px;
  color: var(--line); /* 顏色調得很淡，接近背景色 */
  margin-top: 30px;
  margin-bottom: 10px;
  user-select: none;
}
.footer-credits a {
  color: inherit;
  text-decoration: none;
}
.footer-credits a:hover {
  color: var(--ink-soft); /* 滑鼠游標移上去才會稍微變深 */
  text-decoration: underline;
}
</style>
</head>
<body>

<div class="board">
  <div class="nav-tabs">
    <button class="tab-btn active" id="tab-check" onclick="switchTab('check')">打掃檢查</button>
    <button class="tab-btn" id="tab-pending" onclick="switchTab('pending')">待打掃／未合格</button>
    <button class="tab-btn" id="tab-weekly" onclick="switchTab('weekly')">本週打掃狀況</button>
  </div>

  <div id="view-check">
    <div class="masthead">
      <h1>今日打掃檢查</h1>
      <div class="date" id="today-label"></div>
    </div>

    <div class="who-box" id="who-box"></div>
    <div class="roster-strip" id="roster-strip"></div>
    <div id="floors"></div>

    <details class="admin">
      <summary>管理設定</summary>
      <div class="admin-body" id="admin-body">
        本月清潔工由系統於每月 1 號自動依書院成員重新抽選；每日的檢查結果每天自動重置。
        <div>
          <button id="reroll-btn" type="button">重新抽選本月清潔工</button>
        </div>
        <div id="admin-submissions"></div>
      </div>
    </details>
  </div>

  <div id="view-pending" style="display:none;">
    <div class="masthead">
      <h1>待打掃／未合格區域</h1>
    </div>
    <div id="pending-places-container"></div>
  </div>

  <div id="view-weekly" style="display:none;">
    <div class="masthead">
      <h1>本週打掃狀況</h1>
    </div>
    <div id="weekly-matrix-container"></div>
  </div>
</div>

<div id="submit-area"></div>

<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="sheet-title"></div>
  <div class="sheet-options" id="sheet-options"></div>
</div>

<div class="footer-credits">
  Designed & Developed by 竹北實中<a href="https://github.com/Jeremy-Liaw" target="_blank">Jeremy</a> & <a href="https://theoyu314159.github.io/" target="_blank">Yuyoru</a>
</div>

<script>

  ],

const FLOOR_ORDER = ['1F','2F','3F'];

const RATINGS = [
  { value:'1', label:'1・非常乾淨' },
  { value:'2', label:'2・有一點灰塵，但大致清掃' },
  { value:'3', label:'3・不合格' }
];
const RATING_LABEL = {};
RATINGS.forEach(r=>RATING_LABEL[r.value]=r.label);

function buildRoster(){
  const counts = { '馭風書院':21, '矽晶書院':21, '曦華書院':20, '靛織書院':20 };
  const roster = {};
  BOOKS.forEach(book=>{
    const n = counts[book];
    roster[book] = Array.from({length:n}, (_,i)=> book.slice(0,2) + String(i+1).padStart(2,'0'));
  });
  return roster;
}
const ROSTER = buildRoster();

function pad(n){ return String(n).padStart(2,'0'); }
function monthKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function dateKey(d){ return monthKey(d) + '-' + pad(d.getDate()); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const now = new Date();
const MKEY = monthKey(now);
const DKEY = dateKey(now);

let tasksData = null;
let inspectorData = null;
let checklistData = null;
let submissions = null;
let selectedBook = null;

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzPh4T_EH-xYxmMSNz4T-rShsQwbeEUA8EQ9NpGGig-j7YMCBn2StSJINVzycyOtXqj/exec';

async function loadAll(){
  tasksData = DEFAULT_TASKS;
  const kv = await fetchDump();

  inspectorData = kv['inspectors:'+MKEY] ? JSON.parse(kv['inspectors:'+MKEY]) : null;
  if(!inspectorData){
    inspectorData = {};
    BOOKS.forEach(book=>{ inspectorData[book] = pick(ROSTER[book]); });
    await saveJSON('inspectors:'+MKEY, inspectorData);
  }
  checklistData = kv['checklist:'+DKEY] ? JSON.parse(kv['checklist:'+DKEY]) : {};
  submissions = kv['submissions:'+DKEY] ? JSON.parse(kv['submissions:'+DKEY]) : {};
}

async function fetchDump(){
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=dump');
    const data = await res.json();
    const map = {};
    (data.rows || []).forEach(r=>{ map[r.key] = r.value; });
    return map;
  }catch(e){
    console.error('dump error', e);
    return {};
  }
}

async function saveJSON(key, obj){
  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'set', key: key, value: JSON.stringify(obj) })
    });
  }catch(e){
    console.error('save error', key, e);
  }
}

function taskId(floor, label){ return floor + '||' + label; }
function floorsForBook(book){
  return FLOOR_ORDER.filter(floor => tasksData[floor].some(item=>item.book===book));
}

/* Bottom sheet */
const sheetBackdrop = document.getElementById('sheet-backdrop');
const sheetEl = document.getElementById('sheet');
function openSheet(title, options, current, onPick){
  document.getElementById('sheet-title').textContent = title;
  const wrap = document.getElementById('sheet-options');
  wrap.innerHTML = options.map(o=>`
    <button class="sheet-option ${o.value===current?'active':''}" data-value="${o.value}" type="button">
      <span>${o.label}</span>
      ${o.value===current?'<span class="check-mark">✓</span>':''}
    </button>`).join('');
  wrap.querySelectorAll('.sheet-option').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      closeSheet();
      onPick(btn.dataset.value);
    });
  });
  sheetBackdrop.classList.add('show');
  sheetEl.classList.add('show');
}
function closeSheet(){
  sheetBackdrop.classList.remove('show');
  sheetEl.classList.remove('show');
}
sheetBackdrop.addEventListener('click', closeSheet);

/* 頁籤切換邏輯 */
function switchTab(tabName) {
  const tabs = ['check', 'pending', 'weekly'];

  tabs.forEach(t => {
    const viewEl = document.getElementById(`view-${t}`);
    const tabEl = document.getElementById(`tab-${t}`);
    
    const isTarget = (t === tabName);
    if (viewEl) viewEl.style.display = isTarget ? 'block' : 'none';
    if (tabEl) tabEl.classList.toggle('active', isTarget);
  });

  const submitArea = document.getElementById('submit-area');
  if (submitArea) {
    submitArea.style.display = (tabName === 'check') ? 'block' : 'none';
  }

  if (tabName === 'pending') {
    renderPendingPlaces();
  } else if (tabName === 'weekly') {
    renderWeeklyMatrix();
  }
}

function renderWhoBox(){
  const el = document.getElementById('who-box');
  if(!selectedBook){
    el.innerHTML = `
      <label>請問您的書院為何？</label>
      <button class="select-trigger placeholder" id="book-trigger" type="button">
        <span>請選擇書院</span>
        <span class="trigger-arrow"></span>
      </button>
    `;
    document.getElementById('book-trigger').addEventListener('click', ()=>{
      openSheet('請選擇書院', BOOKS.map(b=>({value:b,label:b})), selectedBook, (val)=>{
        selectedBook = val;
        render();
      });
    });
  }else{
    const floors = floorsForBook(selectedBook).join('、');
    el.innerHTML = `
      <div class="who-current">
        <div class="info">您的書院：<b>${selectedBook}</b>（負責 ${floors}）<br>本月清潔工：${inspectorData[selectedBook]}</div>
        <button class="swap-btn" id="swap-book-btn" type="button">更換書院</button>
      </div>
    `;
    document.getElementById('swap-book-btn').addEventListener('click', ()=>{
      selectedBook = null;
      render();
    });
  }
}

function render(){
  document.getElementById('today-label').textContent =
    now.toLocaleDateString('zh-TW', { month:'long', day:'numeric', weekday:'short' });

  renderWhoBox();

  const stripEl = document.getElementById('roster-strip');
  stripEl.innerHTML = '';
  BOOKS.forEach(book=>{
    const chip = document.createElement('div');
    chip.className = 'roster-chip';
    chip.innerHTML = `<span class="swatch" style="background:${BOOK_COLOR[book]}"></span>
      <b>${book}</b><span class="who">${inspectorData[book]}</span>`;
    stripEl.appendChild(chip);
  });

  const floorsEl = document.getElementById('floors');
  const submitEl = document.getElementById('submit-area');
  floorsEl.innerHTML = '';

  if(!selectedBook){
    floorsEl.innerHTML = '<div class="empty-hint">請先選擇您的書院，才會顯示需要檢查的樓層與項目。</div>';
    submitEl.innerHTML = '';
    renderAdminSubmissions();
    return;
  }

  const alreadySubmitted = !!submissions[selectedBook];
  let totalTasks = 0, passCount = 0;

  floorsForBook(selectedBook).forEach(floor=>{
    const items = tasksData[floor].filter(item=>item.book===selectedBook);
    const doneCount = items.filter(item=>{
      const v = checklistData[taskId(floor,item.label)];
      return v === '1' || v === '2';
    }).length;
    totalTasks += items.length;
    passCount += doneCount;
    const pct = items.length ? Math.round(doneCount/items.length*100) : 0;

    const card = document.createElement('div');
    card.className = 'floor';

    card.innerHTML = `
      <div class="floor-head">
        <div class="floor-num">${floor}</div>
        <div class="floor-meta">
          <div class="tags">
            <span class="book-tag" style="background:${BOOK_COLOR[selectedBook]}"><span class="swatch"></span>${selectedBook}</span>
          </div>
          <div class="progress-line"><strong>${doneCount}</strong> / ${items.length} 項達到合格以上</div>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="task-list">
        ${items.map(item=>{
          const v = checklistData[taskId(floor,item.label)] || '';
          const levelClass = v ? 'level-'+v : '';
          const triggerLabel = v ? RATING_LABEL[v] : '尚未檢查';
          return `<div class="task-row ${levelClass}" data-floor="${floor}" data-label="${item.label}">
            <div class="label">${item.label}</div>
            <button class="rate-trigger" type="button">
              <span>${triggerLabel}</span>
              <span class="trigger-arrow"></span>
            </button>
          </div>`;
        }).join('')}
      </div>
    `;
    floorsEl.appendChild(card);
  });

  floorsEl.querySelectorAll('.task-row').forEach(row=>{
    const btn = row.querySelector('.rate-trigger');
    if(btn.disabled) return;
    btn.addEventListener('click', ()=>{
      const floor = row.dataset.floor, label = row.dataset.label;
      const id = taskId(floor, label);
      const current = checklistData[id] || '';
      const options = [{value:'',label:'尚未檢查'}, ...RATINGS];
      openSheet(label, options, current, (val)=>{
        if(val){ checklistData[id] = val; } else { delete checklistData[id]; }
        render();
      });
    });
  });

  const allDone = totalTasks > 0 && passCount === totalTasks;
  const submittedNote = alreadySubmitted
    ? `<div class="submitted-note">✓ 今日已於 ${pad(new Date(submissions[selectedBook]).getHours())}:${pad(new Date(submissions[selectedBook]).getMinutes())} 送出過，仍可再次送出更新結果</div>`
    : '';
  submitEl.innerHTML = `
    <div class="submit-box">
      ${submittedNote}
      <div class="hint">${allDone ? '全部項目都已達到合格以上，可以送出今日結果' : `還有 ${totalTasks-passCount} 項尚未達到「有一點灰塵，但大致清掃」以上`}</div>
      <button class="submit-btn" id="submit-btn">${alreadySubmitted ? '重新送出今日結果' : '送出今日結果'}</button>
    </div>`;
  const btn = document.getElementById('submit-btn');
  if(btn){
    btn.addEventListener('click', async ()=>{
      if(!allDone){
        const ok = confirm(`還有 ${totalTasks-passCount} 項尚未達到合格以上，確定要送出嗎？`);
        if(!ok) return;
      }

      const box = btn.closest('.submit-box');
      box.innerHTML = `
        <div class="hint">送出中，請稍候…</div>
        <div class="submit-progress-track"><div class="submit-progress-fill" id="submit-progress-fill"></div></div>
        <div class="submit-progress-pct" id="submit-progress-pct">0%</div>
      `;
      const fillEl = document.getElementById('submit-progress-fill');
      const pctEl = document.getElementById('submit-progress-pct');

      let pct = 0;
      const timer = setInterval(()=>{
        pct += (90 - pct) * 0.12 + 0.6;
        if(pct > 90) pct = 90;
        fillEl.style.width = pct + '%';
        pctEl.textContent = Math.round(pct) + '%';
      }, 120);

      try{
        const latestKV = await fetchDump();
        const serverChecklist = latestKV['checklist:'+DKEY] ? JSON.parse(latestKV['checklist:'+DKEY]) : {};
        floorsForBook(selectedBook).forEach(floor=>{
          tasksData[floor].filter(item=>item.book===selectedBook).forEach(item=>{
            const id = taskId(floor, item.label);
            if(checklistData[id]) serverChecklist[id] = checklistData[id];
            else delete serverChecklist[id];
          });
        });
        checklistData = serverChecklist;
        await saveJSON('checklist:'+DKEY, checklistData);

        const latestSubs = latestKV['submissions:'+DKEY] ? JSON.parse(latestKV['submissions:'+DKEY]) : {};
        latestSubs[selectedBook] = new Date().toISOString();
        submissions = latestSubs;
        await saveJSON('submissions:'+DKEY, submissions);
      } finally {
        clearInterval(timer);
        fillEl.style.width = '100%';
        pctEl.textContent = '100%';
      }

      setTimeout(render, 250);
    });
  }

  renderAdminSubmissions();
}

function renderAdminSubmissions(){
  const el = document.getElementById('admin-submissions');
  el.innerHTML = BOOKS.map(book=>{
    const sub = submissions[book];
    const status = sub ? `已於 ${pad(new Date(sub).getHours())}:${pad(new Date(sub).getMinutes())} 送出` : '尚未送出';
    return `<div class="admin-row">
      <span>${book}：${status}</span>
      ${sub ? `<button data-unsubmit="${book}" type="button">撤銷送出</button>` : ''}
    </div>`;
  }).join('');
  el.querySelectorAll('[data-unsubmit]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const book = btn.dataset.unsubmit;
      if(!confirm(`確定要撤銷 ${book} 今日的送出紀錄嗎？`)) return;
      delete submissions[book];
      await saveJSON('submissions:'+DKEY, submissions);
      render();
    });
  });
}

function renderPendingPlaces() {
  const container = document.getElementById('pending-places-container');
  let hasPending = false;
  let html = '';

  FLOOR_ORDER.forEach(floor => {
    const uncleanedItems = tasksData[floor].filter(item => {
      const status = checklistData[taskId(floor, item.label)];
      return !status || status === '3';
    });

    if (uncleanedItems.length > 0) {
      hasPending = true;
      html += `
        <div class="floor" style="margin-bottom:14px;">
          <div class="floor-head" style="background:#fff;">
            <div class="floor-num">${floor}</div>
            <div class="floor-meta">
              <div style="font-weight:600; font-size:14px; color:var(--bad);">
                剩餘 ${uncleanedItems.length} 個區域待處理
              </div>
            </div>
          </div>
          <div class="task-list">
            ${uncleanedItems.map(item => {
              const status = checklistData[taskId(floor, item.label)];
              const isBad = status === '3';
              const statusText = isBad ? '檢查不合格' : '尚未打掃／未檢查';
              const statusColor = isBad ? 'var(--bad)' : 'var(--warn)';
              const bgColor = isBad ? 'rgba(178,59,59,0.08)' : 'rgba(184,134,11,0.08)';

              return `
                <div class="task-row" style="background:${bgColor}; border-left:4px solid ${statusColor}; margin-bottom:6px; padding:10px; border-radius:6px;">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                      <div class="label" style="font-weight:600;">${item.label}</div>
                      <div style="font-size:12px; color:var(--ink-soft); margin-top:2px;">
                        負責書院：${item.book} (${inspectorData[item.book] || '未定'})
                      </div>
                    </div>
                    <span style="font-size:12px; padding:4px 8px; border-radius:4px; background:#fff; color:${statusColor}; font-weight:600; white-space:nowrap;">
                      ${statusText}
                    </span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }
  });

  if (!hasPending) {
    container.innerHTML = `
      <div class="empty-hint" style="background:#e5f2ea; color:var(--good); border-style:solid; border-color:var(--good);">
        🎉 全校所有區域皆已完成打掃且評分合格！
      </div>`;
    return;
  }

  container.innerHTML = html;
}

async function renderWeeklyMatrix() {
  const container = document.getElementById('weekly-matrix-container');
  if (!container) return;

  container.innerHTML = '<div class="loading">載入當週 (週一至週五) 紀錄中…<div class="loading-bar-track"><div class="loading-bar-fill"></div></div></div>';

  const latestKV = await fetchDump();

  // 1. 計算當週「週一」的日期
  const today = new Date();
  const dayOfWeek = today.getDay(); // 0(日), 1(一), 2(二), ..., 6(六)
  
  // 計算距離本週一相差幾天（如果今天是週日 0，則當週一為 6 天前）
  const distanceToMonday = (dayOfWeek === 0) ? -6 : 1 - dayOfWeek;
  
  const monday = new Date(today);
  monday.setDate(today.getDate() + distanceToMonday);

  // 2. 依序產生當週 週一至週五 的 5 天日期
  const pastDays = [];
  const weekDays = ['一', '二', '三', '四', '五'];

  for (let i = 0; i < 5; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    
    pastDays.push({
      key: dateKey(d),
      label: `${d.getMonth() + 1}/${d.getDate()}`,
      dayName: weekDays[i]
    });
  }

  let html = '';

  FLOOR_ORDER.forEach(floor => {
    html += `
      <div class="floor" style="margin-bottom:16px;">
        <div class="floor-head" style="background:#fff;">
          <div class="floor-num">${floor}</div>
          <div style="font-weight:600; font-size:15px;">本週 (一～五) 打掃狀況</div>
        </div>
        <div style="padding:12px; overflow-x:auto;">
          <table style="width:100%; border-collapse:collapse; font-size:13px; text-align:center;">
            <thead>
              <tr style="border-bottom:2px solid var(--line); color:var(--ink-soft);">
                <th style="text-align:left; padding:8px 6px;">位置名稱</th>
                ${pastDays.map(d => `<th style="padding:6px; min-width:48px;">${d.label}<br><span style="font-size:11px; font-weight:normal;">(${d.dayName})</span></th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${tasksData[floor].map(item => {
                const id = taskId(floor, item.label);

                const statusCols = pastDays.map(d => {
                  const dayData = latestKV['checklist:' + d.key] ? JSON.parse(latestKV['checklist:' + d.key]) : {};
                  const status = dayData[id];

                  let mark = '➖';
                  let color = 'var(--ink-soft)';

                  if (status === '1' || status === '2') {
                    mark = '✓';
                    color = 'var(--good)';
                  } else if (status === '3') {
                    mark = '✕';
                    color = 'var(--bad)';
                  }

                  return `<td style="padding:8px 4px; color:${color}; font-weight:bold; font-size:14px;">${mark}</td>`;
                }).join('');

                return `
                  <tr style="border-bottom:1px solid var(--line);">
                    <td style="text-align:left; padding:10px 6px; font-weight:500;">${item.label}</td>
                    ${statusCols}
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

document.getElementById('reroll-btn').addEventListener('click', async ()=>{
  if(!confirm('確定要重新抽選本月清潔工嗎？這會覆蓋目前的名單。')) return;
  BOOKS.forEach(book=>{ inspectorData[book] = pick(ROSTER[book]); });
  await saveJSON('inspectors:'+MKEY, inspectorData);
  render();
});

(async function init(){
  if(APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
    document.getElementById('floors').innerHTML =
      '<div class="empty-hint">尚未設定資料庫網址：請把程式碼最上面的 APPS_SCRIPT_URL 換成你部署 Apps Script 後拿到的 /exec 網址。</div>';
    return;
  }
  document.getElementById('floors').innerHTML =
    '<div class="loading">載入中…<div class="loading-bar-track"><div class="loading-bar-fill"></div></div></div>';
  await loadAll();
  render();
})();
</script>
