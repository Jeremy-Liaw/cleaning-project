<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打掃工作分配表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2f1ec;
    --ink:#22241f;
    --ink-soft:#5c5e57;
    --line:#d8d6cd;
    --card:#fbfaf7;
    --book-wind:#3f7ea6;
    --book-si:#3e8e73;
    --book-dawn:#d97e3d;
    --book-indigo:#4b4e93;
    --good:#2f8f5b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .board{
    max-width:640px;
    margin:0 auto;
    padding:28px 18px 64px;
  }
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:3px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:6px;
  }
  .masthead h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:34px;
    letter-spacing:0.3px;
    margin:0;
    line-height:1;
  }
  .masthead .date{
    font-size:13px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .roster-strip{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:18px 0 30px;
  }
  .roster-chip{
    display:flex;
    align-items:center;
    gap:7px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    padding:6px 10px 6px 8px;
    font-size:13px;
  }
  .swatch{
    width:9px;height:9px;border-radius:2px;flex:none;
  }
  .roster-chip b{font-weight:600;}
  .roster-chip .who{color:var(--ink-soft);}

  .floor{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:4px;
    margin-bottom:16px;
    overflow:hidden;
  }
  .floor-head{
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    user-select:none;
  }
  .floor-num{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:40px;
    line-height:1;
    width:56px;
    flex:none;
    color:var(--ink);
  }
  .floor-meta{flex:1;min-width:0;}
  .floor-meta .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
  .book-tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    padding:2px 8px 2px 6px;
    border-radius:99px;
    color:#fff;
  }
  .book-tag .swatch{background:#fff;opacity:0.9;}
  .floor-meta .progress-line{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .progress-line strong{color:var(--ink);font-weight:600;}
  .chev{
    flex:none;
    font-size:18px;
    color:var(--ink-soft);
    transform:rotate(0deg);
    transition:transform .18s ease;
  }
  .floor.open .chev{transform:rotate(180deg);}

  .progress-track{
    height:3px;
    background:var(--line);
  }
  .progress-fill{
    height:100%;
    background:var(--good);
    transition:width .25s ease;
  }

  .task-list{
    display:none;
    padding:6px 16px 14px;
  }
  .floor.open .task-list{display:block;}
  .task-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 2px;
    border-bottom:1px solid var(--line);
  }
  .task-row:last-of-type{border-bottom:none;}
  .task-row .label{
    flex:1;
    font-size:15px;
  }
  .task-row.done .label{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:var(--line);
  }
  .check{
    width:24px;height:24px;
    flex:none;
    border:1.5px solid var(--ink-soft);
    border-radius:5px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .check.checked{
    background:var(--good);
    border-color:var(--good);
    transform:scale(1.04);
  }
  .check svg{
    width:14px;height:14px;
    opacity:0;
    transform:scale(0.6);
    transition:opacity .1s ease, transform .12s ease;
  }
  .check.checked svg{opacity:1;transform:scale(1);}
  .add-row{
    display:flex;
    gap:8px;
    padding:12px 2px 4px;
  }
  .add-row input{
    flex:1;
    border:1px solid var(--line);
    background:#fff;
    border-radius:4px;
    padding:8px 10px;
    font-size:14px;
    font-family:inherit;
  }
  .add-row button{
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    border-radius:4px;
    padding:0 14px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
  }

  details.admin{
    margin-top:26px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  details.admin summary{
    cursor:pointer;
    font-size:13px;
    color:var(--ink-soft);
    list-style:none;
  }
  details.admin summary::-webkit-details-marker{display:none;}
  .admin-body{
    margin-top:12px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.7;
  }
  .admin-body button{
    margin-top:8px;
    border:1px solid var(--ink-soft);
    background:#fff;
    color:var(--ink);
    border-radius:4px;
    padding:7px 12px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
  }
  .loading{
    padding:60px 0;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }

  .submit-box{
    margin-top:10px;
    padding:18px 16px;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:4px;
    text-align:center;
  }
  .submit-box .hint{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .submit-btn{
    width:100%;
    border:none;
    border-radius:4px;
    padding:14px;
    font-size:16px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    cursor:pointer;
    background:var(--ink);
    color:#fff;
  }
  .submit-btn:disabled{
    background:var(--line);
    color:var(--ink-soft);
    cursor:not-allowed;
  }
  .submitted-banner{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px;
    border-radius:4px;
    background:#e5f2ea;
    color:var(--good);
    font-weight:600;
    font-size:15px;
  }
</style>
</head>
<body>
<div class="board">
  <div class="masthead">
    <h1>今日打掃檢查</h1>
    <div class="date" id="today-label"></div>
  </div>
  <div class="roster-strip" id="roster-strip"></div>
  <div id="floors"></div>
  <div id="submit-area"></div>

  <details class="admin">
    <summary>管理設定</summary>
    <div class="admin-body">
      本月清潔工由系統於每月 1 號自動依書院成員重新抽選；打勾狀態每日自動重置。
      <div>
        PS. 此網頁為範例網頁，若成功當選，將更新整體功能，並建立雲端空間。
        目前無法做到後台控制，敬請見諒
      </div>
      <div>
        靛織書院全體
      </div>
      <div>
        <button id="reroll-btn" type="button">重新抽選本月清潔工</button>
        <button id="unsubmit-btn" type="button" style="display:none;">撤銷今日送出</button>
      </div>
    </div>
  </details>
</div>

<script>
const BOOKS = ['馭風書院','矽晶書院','曦華書院','靛織書院'];
const BOOK_COLOR = {
  '馭風書院':'var(--book-wind)',
  '矽晶書院':'var(--book-si)',
  '曦華書院':'var(--book-dawn)',
  '靛織書院':'var(--book-indigo)'
};
// 樓層 -> 負責書院
const FLOOR_BOOKS = {
  '1F': ['曦華書院','靛織書院'],
  '2F': ['馭風書院'],
  '3F': ['矽晶書院']
};
const FLOOR_ORDER = ['1F','2F','3F'];

const DEFAULT_TASKS = {
  '1F': [
    '警衛室附近地板',
    '花圃維護',
    '走廊地板（靠共伴樞）',
    '花園',
    '火塘－地板',
    '火塘－桌子',
    '創客空間－地板',
    '創客空間－窗戶及桌椅',
    '性別友善廁所－洗手台',
    '性別友善廁所－馬桶',
    '性別友善廁所－地板',
    '無障礙廁所＋廁所走廊－地板',
    '無障礙廁所＋廁所走廊－刷馬桶、小便斗',
    '垃圾儲藏室（分類垃圾）',
    '一樓大廳－花圃維護',
    '一樓大廳－地板簡單清潔',
    '泮林－窗戶',
    '泮林－櫃子',
    '泮林－地板',
    '體育器材室（整理器材）',
    '一樓走廊－第一部分（掃拖）',
    '一樓走廊－第二部分（掃拖）',
    '一樓走廊－第三部分（掃拖）',
    '樓梯－共伴樞旁',
    '樓梯－廁所旁',
    '樓梯－通學樓梯（到 2F 空地）'
  ],
  '2F': [
    '教研樞旁花圃',
    '教研樞旁空地地板維護',
    '一般教室（一）',
    '一般教室（二）',
    '廁所－地板',
    '廁所－男廁刷馬桶等',
    '廁所－女廁刷馬桶等',
    '教研樞旁廁所－男廁',
    '教研樞旁廁所－女廁',
    '走廊＋無障礙廁所',
    '議策樞維護',
    '教研樞前空地',
    '通往一樓校園鏤空處（欄杆＋地板）',
    '向陽階梯附近地板一',
    '向陽階梯附近地板二',
    '樓梯－向陽階梯＋後方花圃維護（到 2F）',
    '樓梯－廁所樓梯（靠近一般教室）',
    '樓梯－廁所樓梯（靠近教研樞）'
  ],
  '3F': [
    '淬維護',
    '一般教室（一）',
    '一般教室（二）',
    '廁所－地板',
    '廁所－男廁刷馬桶等',
    '廁所－女廁刷馬桶等',
    '花圃旁廁所－男廁',
    '花圃旁廁所－女廁',
    '走廊＋無障礙廁所',
    '地科／生物教室維護',
    'PBL 研創維護',
    '迴響維護',
    '走廊－第一部分（掃加拖）',
    '走廊－第二部分（掃加拖）',
    '走廊－第三部分（掃加拖）',
    '走廊－第四部分（掃加拖）',
    '走廊－第五部分（掃加拖）',
    '花圃空間'
  ]
};

// 全校 82 人範例名冊（依書院分組，之後可替換成真實名單）
function buildRoster(){
  const counts = { '馭風書院':21, '矽晶書院':21, '曦華書院':20, '靛織書院':20 };
  const roster = {};
  BOOKS.forEach(book=>{
    const n = counts[book];
    roster[book] = Array.from({length:n}, (_,i)=> book.slice(0,2) + String(i+1).padStart(2,'0'));
  });
  return roster;
}
const ROSTER = buildRoster();

function pad(n){ return String(n).padStart(2,'0'); }
function monthKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function dateKey(d){ return monthKey(d) + '-' + pad(d.getDate()); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const now = new Date();
const MKEY = monthKey(now);
const DKEY = dateKey(now);

let tasksData = null;      // {floor: [taskName,...]}
let inspectorData = null;  // {book: name}
let checklistData = null;  // {"floor||task": true}
let submissionData = null; // {at: isoString} | null
const openFloors = { '1F': true, '2F': false, '3F': false };

async function loadAll(){
  tasksData = await loadJSON('tasks', DEFAULT_TASKS);
  inspectorData = await loadJSON('inspectors:'+MKEY, null);
  if(!inspectorData){
    inspectorData = {};
    BOOKS.forEach(book=>{ inspectorData[book] = pick(ROSTER[book]); });
    await saveJSON('inspectors:'+MKEY, inspectorData);
  }
  checklistData = await loadJSON('checklist:'+DKEY, {});
  submissionData = await loadJSON('submission:'+DKEY, null);
}

async function loadJSON(key, fallback){
  try{
    const res = await window.storage.get(key, true);
    return res ? JSON.parse(res.value) : fallback;
  }catch(e){
    return fallback;
  }
}
async function saveJSON(key, obj){
  try{
    await window.storage.set(key, JSON.stringify(obj), true);
  }catch(e){
    console.error('storage error', key, e);
  }
}

function taskId(floor, task){ return floor + '||' + task; }

function render(){
  document.getElementById('today-label').textContent =
    now.toLocaleDateString('zh-TW', { month:'long', day:'numeric', weekday:'short' });

  // 本月清潔工總覽
  const stripEl = document.getElementById('roster-strip');
  stripEl.innerHTML = '';
  BOOKS.forEach(book=>{
    const chip = document.createElement('div');
    chip.className = 'roster-chip';
    chip.innerHTML = `<span class="swatch" style="background:${BOOK_COLOR[book]}"></span>
      <b>${book}</b><span class="who">${inspectorData[book]}</span>`;
    stripEl.appendChild(chip);
  });

  const floorsEl = document.getElementById('floors');
  floorsEl.innerHTML = '';

  let totalTasks = 0, totalDone = 0;

  FLOOR_ORDER.forEach((floor, idx)=>{
    const books = FLOOR_BOOKS[floor] || [];
    const tasks = tasksData[floor] || [];
    const doneCount = tasks.filter(t => checklistData[taskId(floor,t)]).length;
    const pct = tasks.length ? Math.round(doneCount/tasks.length*100) : 0;
    totalTasks += tasks.length;
    totalDone += doneCount;

    const card = document.createElement('div');
    card.className = 'floor' + (openFloors[floor] ? ' open' : '');

    const tagsHtml = books.map(b=>
      `<span class="book-tag" style="background:${BOOK_COLOR[b]}">
        <span class="swatch"></span>${b}・${inspectorData[b]}
      </span>`).join('');

    card.innerHTML = `
      <div class="floor-head">
        <div class="floor-num">${floor}</div>
        <div class="floor-meta">
          <div class="tags">${tagsHtml}</div>
          <div class="progress-line"><strong>${doneCount}</strong> / ${tasks.length} 項已完成</div>
        </div>
        <div class="chev">⌄</div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="task-list">
        ${tasks.map(t=>{
          const done = !!checklistData[taskId(floor,t)];
          return `<div class="task-row ${done?'done':''}" data-floor="${floor}" data-task="${t}">
            <div class="check ${done?'checked':''}" style="${submissionData?'opacity:.55;cursor:default;':''}">
              <svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="label">${t}</div>
          </div>`;
        }).join('')}
      </div>
    `;

    card.querySelector('.floor-head').addEventListener('click', ()=>{
      openFloors[floor] = !openFloors[floor];
      card.classList.toggle('open');
    });

    floorsEl.appendChild(card);
  });

  // checkbox toggle
  floorsEl.querySelectorAll('.task-row').forEach(row=>{
    row.querySelector('.check').addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(submissionData) return; // 今日已送出，鎖定不可再改
      const floor = row.dataset.floor, task = row.dataset.task;
      const id = taskId(floor, task);
      checklistData[id] = !checklistData[id];
      await saveJSON('checklist:'+DKEY, checklistData);
      render();
    });
  });

  // 繳交區塊
  const submitEl = document.getElementById('submit-area');
  const allDone = totalTasks > 0 && totalDone === totalTasks;
  if(submissionData){
    const t = new Date(submissionData.at);
    submitEl.innerHTML = `<div class="submitted-banner">✓ 今日打掃已於 ${pad(t.getHours())}:${pad(t.getMinutes())} 送出</div>`;
  }else{
    submitEl.innerHTML = `
      <div class="submit-box">
        <div class="hint">${allDone ? '全部項目已完成，可以送出今日結果' : `還有 ${totalTasks-totalDone} 項未完成才能送出`}</div>
        <button class="submit-btn" id="submit-btn" ${allDone?'':'disabled'}>送出今日結果</button>
      </div>`;
    const btn = document.getElementById('submit-btn');
    if(btn){
      btn.addEventListener('click', async ()=>{
        submissionData = { at: new Date().toISOString() };
        await saveJSON('submission:'+DKEY, submissionData);
        render();
      });
    }
  }
  document.getElementById('unsubmit-btn').style.display = submissionData ? 'inline-block' : 'none';
}

document.getElementById('reroll-btn').addEventListener('click', async ()=>{
  if(!confirm('確定要重新抽選本月清潔工嗎？這會覆蓋目前的名單。')) return;
  BOOKS.forEach(book=>{ inspectorData[book] = pick(ROSTER[book]); });
  await saveJSON('inspectors:'+MKEY, inspectorData);
  render();
});

document.getElementById('unsubmit-btn').addEventListener('click', async ()=>{
  if(!confirm('確定要撤銷今日的送出紀錄嗎？')) return;
  submissionData = null;
  await saveJSON('submission:'+DKEY, null);
  render();
});

(async function init(){
  document.getElementById('floors').innerHTML = '<div class="loading">載入中…</div>';
  await loadAll();
  render();
})();
</script>
</body>
</html>
