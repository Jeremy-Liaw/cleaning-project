<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>打掃工作分配表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2f1ec;
    --ink:#22241f;
    --ink-soft:#5c5e57;
    --line:#d8d6cd;
    --card:#fbfaf7;
    --book-wind:#3f7ea6;
    --book-si:#3e8e73;
    --book-dawn:#d97e3d;
    --book-indigo:#4b4e93;
    --good:#2f8f5b;
    --warn:#b8860b;
    --bad:#b23b3b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  .board{
    max-width:520px;
    margin:0 auto;
    padding:20px 16px calc(120px + env(safe-area-inset-bottom));
  }
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:3px solid var(--ink);
    padding-bottom:12px;
    margin-bottom:14px;
  }
  .masthead h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.3px;
    margin:0;
    line-height:1;
  }
  .masthead .date{
    font-size:12.5px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }

  .who-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    margin-bottom:16px;
  }
  .who-box label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .who-current{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .who-current .info{font-size:13.5px;line-height:1.5;}
  .who-current .info b{font-weight:600;}
  .who-current .swap-btn{
    flex:none;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-size:12.5px;
    border-radius:99px;
    padding:6px 12px;
    cursor:pointer;
  }

  /* 自訂下拉觸發按鈕 */
  .select-trigger{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fff;
    padding:12px 14px;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
  }
  .select-trigger.placeholder{color:var(--ink-soft);}
  .trigger-arrow{
    flex:none;
    width:11px;height:11px;
    border-right:2px solid var(--ink-soft);
    border-bottom:2px solid var(--ink-soft);
    transform:rotate(45deg);
    margin-top:-4px;
  }

  .roster-strip{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:0 0 18px;
  }
  .roster-chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:99px;
    padding:5px 10px 5px 8px;
    font-size:12px;
  }
  .swatch{
    width:8px;height:8px;border-radius:2px;flex:none;
  }
  .roster-chip b{font-weight:600;}
  .roster-chip .who{color:var(--ink-soft);}

  .empty-hint{
    padding:36px 16px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    border:1px dashed var(--line);
    border-radius:10px;
  }

  .floor{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:10px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .floor-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 14px;
    border-bottom:1px solid var(--line);
  }
  .floor-num{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:34px;
    line-height:1;
    width:48px;
    flex:none;
    color:var(--ink);
  }
  .floor-meta{flex:1;min-width:0;}
  .floor-meta .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
  .book-tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11.5px;
    padding:2px 8px 2px 6px;
    border-radius:99px;
    color:#fff;
  }
  .book-tag .swatch{background:#fff;opacity:0.9;}
  .floor-meta .progress-line{
    font-size:12px;
    color:var(--ink-soft);
  }
  .progress-line strong{color:var(--ink);font-weight:600;}

  .progress-track{
    height:3px;
    background:var(--line);
  }
  .progress-fill{
    height:100%;
    background:var(--good);
    transition:width .25s ease;
  }

  .task-list{
    padding:4px 12px 12px;
  }
  .task-row{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:11px 8px;
    border-bottom:1px solid var(--line);
    border-radius:6px;
  }
  .task-row:last-of-type{border-bottom:none;}
  .task-row .label{
    font-size:14.5px;
  }
  .task-row.level-1{background:rgba(47,143,91,0.08);}
  .task-row.level-2{background:rgba(184,134,11,0.09);}
  .task-row.level-3{background:rgba(178,59,59,0.10);}

  .rate-trigger{
    align-self:flex-start;
    display:flex;
    align-items:center;
    gap:8px;
    border:1.5px solid var(--line);
    border-radius:99px;
    background:#fff;
    color:var(--ink-soft);
    font-size:13px;
    font-weight:500;
    padding:8px 12px;
    cursor:pointer;
  }
  .rate-trigger .trigger-arrow{
    border-color:currentColor;
    opacity:.7;
  }
  .task-row.level-1 .rate-trigger{border-color:var(--good);color:var(--good);background:rgba(47,143,91,0.08);}
  .task-row.level-2 .rate-trigger{border-color:var(--warn);color:var(--warn);background:rgba(184,134,11,0.09);}
  .task-row.level-3 .rate-trigger{border-color:var(--bad);color:var(--bad);background:rgba(178,59,59,0.10);}
  .rate-trigger:disabled{opacity:.6;cursor:default;}

  /* Bottom sheet */
  .sheet-backdrop{
    position:fixed;inset:0;
    background:rgba(20,20,16,0.4);
    opacity:0;pointer-events:none;
    transition:opacity .18s ease;
    z-index:90;
  }
  .sheet-backdrop.show{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    background:#fff;
    border-radius:16px 16px 0 0;
    box-shadow:0 -10px 30px rgba(0,0,0,.18);
    transform:translateY(100%);
    transition:transform .22s cubic-bezier(.2,.8,.3,1);
    z-index:100;
    max-height:72vh;
    overflow-y:auto;
    padding:10px 6px calc(14px + env(safe-area-inset-bottom));
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{
    width:36px;height:4px;
    background:var(--line);
    border-radius:99px;
    margin:4px auto 12px;
  }
  .sheet-title{
    font-size:13px;
    color:var(--ink-soft);
    padding:0 12px 8px;
  }
  .sheet-options{padding:0 6px;}
  .sheet-option{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:none;
    border:none;
    border-bottom:1px solid var(--line);
    text-align:left;
    padding:14px 10px;
    font-size:15.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .sheet-option:last-child{border-bottom:none;}
  .sheet-option.active{font-weight:600;color:var(--good);}
  .sheet-option .check-mark{color:var(--good);font-weight:700;}

  details.admin{
    margin-top:22px;
    border-top:1px solid var(--line);
    padding-top:12px;
  }
  details.admin summary{
    cursor:pointer;
    font-size:13px;
    color:var(--ink-soft);
    list-style:none;
  }
  details.admin summary::-webkit-details-marker{display:none;}
  .admin-body{
    margin-top:12px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.7;
  }
  .admin-body button{
    margin-top:8px;
    margin-right:6px;
    border:1px solid var(--ink-soft);
    background:#fff;
    color:var(--ink);
    border-radius:99px;
    padding:7px 12px;
    font-size:12.5px;
    cursor:pointer;
  }
  .admin-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:6px 0;
    border-bottom:1px solid var(--line);
  }
  .admin-row:last-child{border-bottom:none;}
  .loading{
    padding:50px 0;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }

  /* 底部固定送出列 */
  #submit-area{
    position:fixed;
    left:0;right:0;bottom:0;
    padding:10px 16px calc(14px + env(safe-area-inset-bottom));
    z-index:40;
  }
  .submit-box{
    max-width:520px;
    margin:0 auto;
    padding:14px 14px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:12px;
    box-shadow:0 -4px 18px rgba(0,0,0,.10);
    text-align:center;
  }
  .submit-box .hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .submit-btn{
    width:100%;
    border:none;
    border-radius:10px;
    padding:14px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    background:var(--ink);
    color:#fff;
  }
  .submit-btn:disabled{
    background:var(--line);
    color:var(--ink-soft);
    cursor:not-allowed;
  }
  .submitted-banner{
    max-width:520px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px;
    border-radius:12px;
    background:#e5f2ea;
    color:var(--good);
    font-weight:600;
    font-size:14.5px;
    box-shadow:0 -4px 18px rgba(0,0,0,.10);
  }
  .submitted-note{
    font-size:12.5px;
    color:var(--good);
    font-weight:600;
    margin-bottom:8px;
  }
</style>
</head>
<body>
<div class="board">
  <div class="masthead">
    <h1>今日打掃檢查</h1>
    <div class="date" id="today-label"></div>
  </div>

  <div class="who-box" id="who-box"></div>
  <div class="roster-strip" id="roster-strip"></div>
  <div id="floors"></div>

  <details class="admin">
    <summary>管理設定</summary>
    <div class="admin-body" id="admin-body">
      本月清潔工由系統於每月 1 號自動依書院成員重新抽選；每日的檢查結果每天自動重置。
      <div>
        <button id="reroll-btn" type="button">重新抽選本月清潔工</button>
      </div>
      <div id="admin-submissions"></div>
    </div>
  </details>
</div>

<div id="submit-area"></div>

<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="sheet-title"></div>
  <div class="sheet-options" id="sheet-options"></div>
</div>

<script>
const BOOKS = ['馭風書院','矽晶書院','曦華書院','靛織書院'];
const BOOK_COLOR = {
  '馭風書院':'var(--book-wind)',
  '矽晶書院':'var(--book-si)',
  '曦華書院':'var(--book-dawn)',
  '靛織書院':'var(--book-indigo)'

// 每個打掃項目歸屬的樓層與書院
const DEFAULT_TASKS = {

    { label:'花園', book:'曦華書院' },

    { label:'火塘－桌子', book:'靛織書院' },
    { label:'創客空間－地板', book:'靛織書院' },
    { label:'創客空間－窗戶及桌椅', book:'靛織書院' },
    { label:'性別友善廁所－洗手台', book:'曦華書院' },
    { label:'性別友善廁所－馬桶', book:'曦華書院' },
    { label:'性別友善廁所－地板', book:'曦華書院' },
    { label:'無障礙廁所＋廁所走廊－地板', book:'曦華書院' },
    { label:'無障礙廁所＋廁所走廊－刷馬桶、小便斗', book:'曦華書院' },
    { label:'垃圾儲藏室（分類垃圾）', book:'靛織書院' },
    { label:'一樓大廳－花圃維護', book:'曦華書院' },
    { label:'一樓大廳－地板簡單清潔', book:'曦華書院' },
    { label:'泮林－窗戶', book:'靛織書院' },
    { label:'泮林－櫃子', book:'靛織書院' },
    { label:'泮林－地板', book:'靛織書院' },
    { label:'體育器材室（整理器材）', book:'靛織書院' },
    { label:'一樓走廊－第一部分（掃拖）', book:'曦華書院' },
    { label:'一樓走廊－第二部分（掃拖）', book:'曦華書院' },
    { label:'一樓走廊－第三部分（掃拖）', book:'曦華書院' },
    { label:'樓梯－共伴樞旁', book:'曦華書院' },
    { label:'樓梯－廁所旁', book:'曦華書院' },
    { label:'樓梯－通學樓梯（到 2F 空地）', book:'曦華書院' }
  ],
  '2F': [
    { label:'教研樞旁花圃', book:'馭風書院' },
    { label:'教研樞旁空地地板維護', book:'馭風書院' },
    { label:'一般教室（一）', book:'馭風書院' },
    { label:'一般教室（二）', book:'馭風書院' },
    { label:'廁所－地板', book:'馭風書院' },
    { label:'廁所－男廁刷馬桶等', book:'馭風書院' },
    { label:'廁所－女廁刷馬桶等', book:'馭風書院' },
    { label:'教研樞旁廁所－男廁', book:'馭風書院' },
    { label:'教研樞旁廁所－女廁', book:'馭風書院' },
    { label:'走廊＋無障礙廁所', book:'馭風書院' },
    { label:'議策樞維護', book:'馭風書院' },
    { label:'教研樞前空地', book:'馭風書院' },
    { label:'通往一樓校園鏤空處（欄杆＋地板）', book:'馭風書院' },
    { label:'向陽階梯附近地板一', book:'馭風書院' },
    { label:'向陽階梯附近地板二', book:'馭風書院' },
    { label:'樓梯－向陽階梯＋後方花圃維護（到 2F）', book:'馭風書院' },
    { label:'樓梯－廁所樓梯（靠近一般教室）', book:'馭風書院' },
    { label:'樓梯－廁所樓梯（靠近教研樞）', book:'馭風書院' }
  ],
  '3F': [
    { label:'淬維護', book:'矽晶書院' },
    { label:'一般教室（一）', book:'矽晶書院' },
    { label:'一般教室（二）', book:'矽晶書院' },
    { label:'廁所－地板', book:'矽晶書院' },
    { label:'廁所－男廁刷馬桶等', book:'矽晶書院' },
    { label:'廁所－女廁刷馬桶等', book:'矽晶書院' },
    { label:'花圃旁廁所－男廁', book:'矽晶書院' },
    { label:'花圃旁廁所－女廁', book:'矽晶書院' },
    { label:'走廊＋無障礙廁所', book:'矽晶書院' },
    { label:'地科／生物教室維護', book:'矽晶書院' },
    { label:'PBL 研創維護', book:'矽晶書院' },
    { label:'迴響維護', book:'矽晶書院' },
    { label:'走廊－第一部分（掃加拖）', book:'矽晶書院' },
    { label:'走廊－第二部分（掃加拖）', book:'矽晶書院' },
    { label:'走廊－第三部分（掃加拖）', book:'矽晶書院' },
    { label:'走廊－第四部分（掃加拖）', book:'矽晶書院' },
    { label:'走廊－第五部分（掃加拖）', book:'矽晶書院' },
    { label:'花圃空間', book:'矽晶書院' }
  ]
};
const FLOOR_ORDER = ['1F','2F','3F'];

const RATINGS = [
  { value:'1', label:'1・非常乾淨' },
  { value:'2', label:'2・有一點灰塵，但大致清掃' },
  { value:'3', label:'3・不合格' }
];
const RATING_LABEL = {};
RATINGS.forEach(r=>RATING_LABEL[r.value]=r.label);

// 全校 82 人範例名冊（依書院分組，之後可替換成真實名單）
function buildRoster(){
  const counts = { '馭風書院':21, '矽晶書院':21, '曦華書院':20, '靛織書院':20 };
  const roster = {};
  BOOKS.forEach(book=>{
    const n = counts[book];
    roster[book] = Array.from({length:n}, (_,i)=> book.slice(0,2) + String(i+1).padStart(2,'0'));
  });
  return roster;
}
const ROSTER = buildRoster();

function pad(n){ return String(n).padStart(2,'0'); }
function monthKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function dateKey(d){ return monthKey(d) + '-' + pad(d.getDate()); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const now = new Date();
const MKEY = monthKey(now);
const DKEY = dateKey(now);

let tasksData = null;        // {floor: [{label, book}]}
let inspectorData = null;    // {book: name}
let checklistData = null;    // {"floor||label": "1"|"2"|"3"}
let submissions = null;      // {book: isoString}
let selectedBook = null;     // 目前選擇的書院

async function loadAll(){
  tasksData = DEFAULT_TASKS;
  const kv = await fetchDump(); // 一次抓回所有 key，避免每個 key 各打一次 API（Apps Script 每次請求都有延遲）

  inspectorData = kv['inspectors:'+MKEY] ? JSON.parse(kv['inspectors:'+MKEY]) : null;
  if(!inspectorData){
    inspectorData = {};
    BOOKS.forEach(book=>{ inspectorData[book] = pick(ROSTER[book]); });
    await saveJSON('inspectors:'+MKEY, inspectorData);
  }
  checklistData = kv['checklist:'+DKEY] ? JSON.parse(kv['checklist:'+DKEY]) : {};
  submissions = kv['submissions:'+DKEY] ? JSON.parse(kv['submissions:'+DKEY]) : {};
}

async function fetchDump(){
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=dump');
    const data = await res.json();
    const map = {};
    (data.rows || []).forEach(r=>{ map[r.key] = r.value; });
    return map;
  }catch(e){
    console.error('dump error', e);
    return {};
  }
}

// 把這裡換成你部署 Apps Script 網頁應用程式後拿到的網址
// 例如：https://script.google.com/macros/s/AKfycb.../exec
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzPh4T_EH-xYxmMSNz4T-rShsQwbeEUA8EQ9NpGGig-j7YMCBn2StSJINVzycyOtXqj/exec';

async function saveJSON(key, obj){
  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      // 用 text/plain 避免瀏覽器對 Apps Script 發出 CORS 預檢請求（OPTIONS），
      // Apps Script 的 doPost 還是能正常用 JSON.parse 解析內容。
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'set', key: key, value: JSON.stringify(obj) })
    });
  }catch(e){
    console.error('save error', key, e);
  }
}

function taskId(floor, label){ return floor + '||' + label; }
function floorsForBook(book){
  return FLOOR_ORDER.filter(floor => tasksData[floor].some(item=>item.book===book));
}

/* ---------- Bottom sheet (自訂下拉選單) ---------- */
const sheetBackdrop = document.getElementById('sheet-backdrop');
const sheetEl = document.getElementById('sheet');
function openSheet(title, options, current, onPick){
  document.getElementById('sheet-title').textContent = title;
  const wrap = document.getElementById('sheet-options');
  wrap.innerHTML = options.map(o=>`
    <button class="sheet-option ${o.value===current?'active':''}" data-value="${o.value}" type="button">
      <span>${o.label}</span>
      ${o.value===current?'<span class="check-mark">✓</span>':''}
    </button>`).join('');
  wrap.querySelectorAll('.sheet-option').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      closeSheet();
      onPick(btn.dataset.value);
    });
  });
  sheetBackdrop.classList.add('show');
  sheetEl.classList.add('show');
}
function closeSheet(){
  sheetBackdrop.classList.remove('show');
  sheetEl.classList.remove('show');
}
sheetBackdrop.addEventListener('click', closeSheet);

/* ---------- 渲染 ---------- */
function renderWhoBox(){
  const el = document.getElementById('who-box');
  if(!selectedBook){
    el.innerHTML = `
      <label>請問您的書院為何？</label>
      <button class="select-trigger placeholder" id="book-trigger" type="button">
        <span>請選擇書院</span>
        <span class="trigger-arrow"></span>
      </button>
    `;
    document.getElementById('book-trigger').addEventListener('click', ()=>{
      openSheet('請選擇書院', BOOKS.map(b=>({value:b,label:b})), selectedBook, (val)=>{
        selectedBook = val;
        render();
      });
    });
  }else{
    const floors = floorsForBook(selectedBook).join('、');
    el.innerHTML = `
      <div class="who-current">
        <div class="info">您的書院：<b>${selectedBook}</b>（負責 ${floors}）<br>本月清潔工：${inspectorData[selectedBook]}</div>
        <button class="swap-btn" id="swap-book-btn" type="button">更換書院</button>
      </div>
    `;
    document.getElementById('swap-book-btn').addEventListener('click', ()=>{
      selectedBook = null;
      render();
    });
  }
}

function render(){
  document.getElementById('today-label').textContent =
    now.toLocaleDateString('zh-TW', { month:'long', day:'numeric', weekday:'short' });

  renderWhoBox();

  const stripEl = document.getElementById('roster-strip');
  stripEl.innerHTML = '';
  BOOKS.forEach(book=>{
    const chip = document.createElement('div');
    chip.className = 'roster-chip';
    chip.innerHTML = `<span class="swatch" style="background:${BOOK_COLOR[book]}"></span>
      <b>${book}</b><span class="who">${inspectorData[book]}</span>`;
    stripEl.appendChild(chip);
  });

  const floorsEl = document.getElementById('floors');
  const submitEl = document.getElementById('submit-area');
  floorsEl.innerHTML = '';

  if(!selectedBook){
    floorsEl.innerHTML = '<div class="empty-hint">請先選擇您的書院，才會顯示需要檢查的樓層與項目。</div>';
    submitEl.innerHTML = '';
    renderAdminSubmissions();
    return;
  }

  const alreadySubmitted = !!submissions[selectedBook];
  let totalTasks = 0, passCount = 0;

  floorsForBook(selectedBook).forEach(floor=>{
    const items = tasksData[floor].filter(item=>item.book===selectedBook);
    const doneCount = items.filter(item=>{
      const v = checklistData[taskId(floor,item.label)];
      return v === '1' || v === '2';
    }).length;
    totalTasks += items.length;
    passCount += doneCount;
    const pct = items.length ? Math.round(doneCount/items.length*100) : 0;

    const card = document.createElement('div');
    card.className = 'floor';

    card.innerHTML = `
      <div class="floor-head">
        <div class="floor-num">${floor}</div>
        <div class="floor-meta">
          <div class="tags">
            <span class="book-tag" style="background:${BOOK_COLOR[selectedBook]}"><span class="swatch"></span>${selectedBook}</span>
          </div>
          <div class="progress-line"><strong>${doneCount}</strong> / ${items.length} 項達到合格以上</div>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="task-list">
        ${items.map(item=>{
          const v = checklistData[taskId(floor,item.label)] || '';
          const levelClass = v ? 'level-'+v : '';
          const triggerLabel = v ? RATING_LABEL[v] : '尚未檢查';
          return `<div class="task-row ${levelClass}" data-floor="${floor}" data-label="${item.label}">
            <div class="label">${item.label}</div>
            <button class="rate-trigger" type="button">
              <span>${triggerLabel}</span>
              <span class="trigger-arrow"></span>
            </button>
          </div>`;
        }).join('')}
      </div>
    `;
    floorsEl.appendChild(card);
  });

  // 評分按鈕：開啟底部選單
  floorsEl.querySelectorAll('.task-row').forEach(row=>{
    const btn = row.querySelector('.rate-trigger');
    if(btn.disabled) return;
    btn.addEventListener('click', ()=>{
      const floor = row.dataset.floor, label = row.dataset.label;
      const id = taskId(floor, label);
      const current = checklistData[id] || '';
      const options = [{value:'',label:'尚未檢查'}, ...RATINGS];
      openSheet(label, options, current, (val)=>{
        if(val){ checklistData[id] = val; } else { delete checklistData[id]; }
        render(); // 只更新畫面，不上傳；等按下「送出」才會一次寫回資料庫
      });
    });
  });

  const allDone = totalTasks > 0 && passCount === totalTasks;
  const submittedNote = alreadySubmitted
    ? `<div class="submitted-note">✓ 今日已於 ${pad(new Date(submissions[selectedBook]).getHours())}:${pad(new Date(submissions[selectedBook]).getMinutes())} 送出過，仍可再次送出更新結果</div>`
    : '';
  submitEl.innerHTML = `
    <div class="submit-box">
      ${submittedNote}
      <div class="hint">${allDone ? '全部項目都已達到合格以上，可以送出今日結果' : `還有 ${totalTasks-passCount} 項尚未達到「有一點灰塵，但大致清掃」以上`}</div>
      <button class="submit-btn" id="submit-btn">${alreadySubmitted ? '重新送出今日結果' : '送出今日結果'}</button>
    </div>`;
  const btn = document.getElementById('submit-btn');
  if(btn){
    btn.addEventListener('click', async ()=>{
      if(!allDone){
        const ok = confirm(`還有 ${totalTasks-passCount} 項尚未達到合格以上，確定要送出嗎？`);
        if(!ok) return;
      }
      btn.disabled = true;
      btn.textContent = '送出中…';

      // 先抓伺服器上最新的整體打勾資料，只把「自己書院負責的項目」蓋上去，
      // 避免蓋掉其他書院同時間送出的結果
      const latestKV = await fetchDump();
      const serverChecklist = latestKV['checklist:'+DKEY] ? JSON.parse(latestKV['checklist:'+DKEY]) : {};
      floorsForBook(selectedBook).forEach(floor=>{
        tasksData[floor].filter(item=>item.book===selectedBook).forEach(item=>{
          const id = taskId(floor, item.label);
          if(checklistData[id]) serverChecklist[id] = checklistData[id];
          else delete serverChecklist[id];
        });
      });
      checklistData = serverChecklist;
      await saveJSON('checklist:'+DKEY, checklistData);

      const latestSubs = latestKV['submissions:'+DKEY] ? JSON.parse(latestKV['submissions:'+DKEY]) : {};
      latestSubs[selectedBook] = new Date().toISOString();
      submissions = latestSubs;
      await saveJSON('submissions:'+DKEY, submissions);
      render();
    });
  }

  renderAdminSubmissions();
}

function renderAdminSubmissions(){
  const el = document.getElementById('admin-submissions');
  el.innerHTML = BOOKS.map(book=>{
    const sub = submissions[book];
    const status = sub ? `已於 ${pad(new Date(sub).getHours())}:${pad(new Date(sub).getMinutes())} 送出` : '尚未送出';
    return `<div class="admin-row">
      <span>${book}：${status}</span>
      ${sub ? `<button data-unsubmit="${book}" type="button">撤銷送出</button>` : ''}
    </div>`;
  }).join('');
  el.querySelectorAll('[data-unsubmit]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const book = btn.dataset.unsubmit;
      if(!confirm(`確定要撤銷 ${book} 今日的送出紀錄嗎？`)) return;
      delete submissions[book];
      await saveJSON('submissions:'+DKEY, submissions);
      render();
    });
  });
}

document.getElementById('reroll-btn').addEventListener('click', async ()=>{
  if(!confirm('確定要重新抽選本月清潔工嗎？這會覆蓋目前的名單。')) return;
  BOOKS.forEach(book=>{ inspectorData[book] = pick(ROSTER[book]); });
  await saveJSON('inspectors:'+MKEY, inspectorData);
  render();
});

(async function init(){
  if(APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
    document.getElementById('floors').innerHTML =
      '<div class="empty-hint">尚未設定資料庫網址：請把程式碼最上面的 APPS_SCRIPT_URL 換成你部署 Apps Script 後拿到的 /exec 網址。</div>';
    return;
  }
  document.getElementById('floors').innerHTML = '<div class="loading">載入中…</div>';
  await loadAll();
  render();
})();
</script>
