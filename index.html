<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打掃工作分配表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2f1ec;
    --ink:#22241f;
    --ink-soft:#5c5e57;
    --line:#d8d6cd;
    --card:#fbfaf7;
    --book-wind:#3f7ea6;
    --book-si:#3e8e73;
    --book-dawn:#d97e3d;
    --book-indigo:#4b4e93;
    --good:#2f8f5b;
    --warn:#b8860b;
    --bad:#b23b3b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .board{
    max-width:640px;
    margin:0 auto;
    padding:28px 18px 64px;
  }
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:3px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:16px;
  }
  .masthead h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:34px;
    letter-spacing:0.3px;
    margin:0;
    line-height:1;
  }
  .masthead .date{
    font-size:13px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }

  .who-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:14px 16px;
    margin-bottom:20px;
  }
  .who-box label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .who-box select{
    width:100%;
    font-family:inherit;
    font-size:15px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
    color:var(--ink);
  }
  .who-current{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .who-current .info{font-size:14px;}
  .who-current .info b{font-weight:600;}
  .who-current .swap-btn{
    flex:none;
    border:none;
    background:none;
    color:var(--ink-soft);
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }

  .roster-strip{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:0 0 22px;
  }
  .roster-chip{
    display:flex;
    align-items:center;
    gap:7px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    padding:6px 10px 6px 8px;
    font-size:13px;
  }
  .swatch{
    width:9px;height:9px;border-radius:2px;flex:none;
  }
  .roster-chip b{font-weight:600;}
  .roster-chip .who{color:var(--ink-soft);}

  .empty-hint{
    padding:40px 18px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    border:1px dashed var(--line);
    border-radius:4px;
  }

  .floor{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:4px;
    margin-bottom:16px;
    overflow:hidden;
  }
  .floor-head{
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .floor-num{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:40px;
    line-height:1;
    width:56px;
    flex:none;
    color:var(--ink);
  }
  .floor-meta{flex:1;min-width:0;}
  .floor-meta .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
  .book-tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    padding:2px 8px 2px 6px;
    border-radius:99px;
    color:#fff;
  }
  .book-tag .swatch{background:#fff;opacity:0.9;}
  .floor-meta .progress-line{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .progress-line strong{color:var(--ink);font-weight:600;}

  .progress-track{
    height:3px;
    background:var(--line);
  }
  .progress-fill{
    height:100%;
    background:var(--good);
    transition:width .25s ease;
  }

  .task-list{
    padding:6px 16px 14px;
  }
  .task-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 10px;
    border-bottom:1px solid var(--line);
    border-radius:3px;
  }
  .task-row:last-of-type{border-bottom:none;}
  .task-row .label{
    flex:1;
    font-size:15px;
  }
  .task-row.level-1{background:rgba(47,143,91,0.08);}
  .task-row.level-2{background:rgba(184,134,11,0.09);}
  .task-row.level-3{background:rgba(178,59,59,0.10);}

  .rate-select{
    flex:none;
    width:180px;
    font-family:inherit;
    font-size:13px;
    padding:8px 8px;
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
    color:var(--ink);
  }
  .task-row.level-1 .rate-select{border-color:var(--good);color:var(--good);}
  .task-row.level-2 .rate-select{border-color:var(--warn);color:var(--warn);}
  .task-row.level-3 .rate-select{border-color:var(--bad);color:var(--bad);}
  .rate-select:disabled{opacity:.6;}

  details.admin{
    margin-top:26px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  details.admin summary{
    cursor:pointer;
    font-size:13px;
    color:var(--ink-soft);
    list-style:none;
  }
  details.admin summary::-webkit-details-marker{display:none;}
  .admin-body{
    margin-top:12px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.7;
  }
  .admin-body button{
    margin-top:8px;
    margin-right:6px;
    border:1px solid var(--ink-soft);
    background:#fff;
    color:var(--ink);
    border-radius:4px;
    padding:7px 12px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
  }
  .admin-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:6px 0;
    border-bottom:1px solid var(--line);
  }
  .admin-row:last-child{border-bottom:none;}
  .loading{
    padding:60px 0;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }

  .submit-box{
    margin-top:10px;
    padding:18px 16px;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:4px;
    text-align:center;
  }
  .submit-box .hint{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .submit-btn{
    width:100%;
    border:none;
    border-radius:4px;
    padding:14px;
    font-size:16px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    cursor:pointer;
    background:var(--ink);
    color:#fff;
  }
  .submit-btn:disabled{
    background:var(--line);
    color:var(--ink-soft);
    cursor:not-allowed;
  }
  .submitted-banner{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px;
    border-radius:4px;
    background:#e5f2ea;
    color:var(--good);
    font-weight:600;
    font-size:15px;
  }
</style>
</head>
<body>
<div class="board">
  <div class="masthead">
    <h1>今日打掃檢查</h1>
    <div class="date" id="today-label"></div>
  </div>

  <div class="who-box" id="who-box"></div>
  <div class="roster-strip" id="roster-strip"></div>
  <div id="floors"></div>
  <div id="submit-area"></div>

  <details class="admin">
    <summary>管理設定</summary>
    <div class="admin-body">

      本月清潔工由系統於每月 1 號自動依書院成員重新抽選；打勾狀態每日自動重置。

      <div>
        PS. 此網頁為範例網頁，若成功當選，將更新整體功能，並建立雲端空間。

        目前無法做到後台控制，敬請見諒。<br><br>
      </div>  
      </div>

            靛織書院全體
      </div>
      
      <div>

</div>

<script>
const BOOKS = ['馭風書院','矽晶書院','曦華書院','靛織書院'];
const BOOK_COLOR = {
  '馭風書院':'var(--book-wind)',
  '矽晶書院':'var(--book-si)',
  '曦華書院':'var(--book-dawn)',
  '靛織書院':'var(--book-indigo)'
};

// 每個打掃項目歸屬的樓層與書院
const DEFAULT_TASKS = {
  '1F': [
    { label:'警衛室附近地板', book:'曦華書院' },
    { label:'花圃維護', book:'曦華書院' },
    { label:'走廊地板（靠共伴樞）', book:'曦華書院' },
    { label:'花園', book:'曦華書院' },
    { label:'火塘－地板', book:'靛織書院' },
    { label:'火塘－桌子', book:'靛織書院' },
    { label:'創客空間－地板', book:'靛織書院' },
    { label:'創客空間－窗戶及桌椅', book:'靛織書院' },
    { label:'性別友善廁所－洗手台', book:'曦華書院' },
    { label:'性別友善廁所－馬桶', book:'曦華書院' },
    { label:'性別友善廁所－地板', book:'曦華書院' },
    { label:'無障礙廁所＋廁所走廊－地板', book:'曦華書院' },
    { label:'無障礙廁所＋廁所走廊－刷馬桶、小便斗', book:'曦華書院' },
    { label:'垃圾儲藏室（分類垃圾）', book:'靛織書院' },
    { label:'一樓大廳－花圃維護', book:'曦華書院' },
    { label:'一樓大廳－地板簡單清潔', book:'曦華書院' },
    { label:'泮林－窗戶', book:'靛織書院' },
    { label:'泮林－櫃子', book:'靛織書院' },
    { label:'泮林－地板', book:'靛織書院' },
    { label:'體育器材室（整理器材）', book:'靛織書院' },
    { label:'一樓走廊－第一部分（掃拖）', book:'曦華書院' },
    { label:'一樓走廊－第二部分（掃拖）', book:'曦華書院' },
    { label:'一樓走廊－第三部分（掃拖）', book:'曦華書院' },
    { label:'樓梯－共伴樞旁', book:'曦華書院' },
    { label:'樓梯－廁所旁', book:'曦華書院' },
    { label:'樓梯－通學樓梯（到 2F 空地）', book:'曦華書院' }
  ],
  '2F': [
    { label:'教研樞旁花圃', book:'馭風書院' },
    { label:'教研樞旁空地地板維護', book:'馭風書院' },
    { label:'一般教室（一）', book:'馭風書院' },
    { label:'一般教室（二）', book:'馭風書院' },
    { label:'廁所－地板', book:'馭風書院' },
    { label:'廁所－男廁刷馬桶等', book:'馭風書院' },
    { label:'廁所－女廁刷馬桶等', book:'馭風書院' },
    { label:'教研樞旁廁所－男廁', book:'馭風書院' },
    { label:'教研樞旁廁所－女廁', book:'馭風書院' },
    { label:'走廊＋無障礙廁所', book:'馭風書院' },
    { label:'議策樞維護', book:'馭風書院' },
    { label:'教研樞前空地', book:'馭風書院' },
    { label:'通往一樓校園鏤空處（欄杆＋地板）', book:'馭風書院' },
    { label:'向陽階梯附近地板一', book:'馭風書院' },
    { label:'向陽階梯附近地板二', book:'馭風書院' },
    { label:'樓梯－向陽階梯＋後方花圃維護（到 2F）', book:'馭風書院' },
    { label:'樓梯－廁所樓梯（靠近一般教室）', book:'馭風書院' },
    { label:'樓梯－廁所樓梯（靠近教研樞）', book:'馭風書院' }
  ],
  '3F': [
    { label:'淬維護', book:'矽晶書院' },
    { label:'一般教室（一）', book:'矽晶書院' },
    { label:'一般教室（二）', book:'矽晶書院' },
    { label:'廁所－地板', book:'矽晶書院' },
    { label:'廁所－男廁刷馬桶等', book:'矽晶書院' },
    { label:'廁所－女廁刷馬桶等', book:'矽晶書院' },
    { label:'花圃旁廁所－男廁', book:'矽晶書院' },
    { label:'花圃旁廁所－女廁', book:'矽晶書院' },
    { label:'走廊＋無障礙廁所', book:'矽晶書院' },
    { label:'地科／生物教室維護', book:'矽晶書院' },
    { label:'PBL 研創維護', book:'矽晶書院' },
    { label:'迴響維護', book:'矽晶書院' },
    { label:'走廊－第一部分（掃加拖）', book:'矽晶書院' },
    { label:'走廊－第二部分（掃加拖）', book:'矽晶書院' },
    { label:'走廊－第三部分（掃加拖）', book:'矽晶書院' },
    { label:'走廊－第四部分（掃加拖）', book:'矽晶書院' },
    { label:'走廊－第五部分（掃加拖）', book:'矽晶書院' },
    { label:'花圃空間', book:'矽晶書院' }
  ]
};
const FLOOR_ORDER = ['1F','2F','3F'];

const RATINGS = [
  { v:'1', label:'1・非常乾淨' },
  { v:'2', label:'2・有一點灰塵，但大致清掃' },
  { v:'3', label:'3・不合格' }
];

// 全校 82 人範例名冊（依書院分組，之後可替換成真實名單）
function buildRoster(){
  const counts = { '馭風書院':21, '矽晶書院':21, '曦華書院':20, '靛織書院':20 };
  const roster = {};
  BOOKS.forEach(book=>{
    const n = counts[book];
    roster[book] = Array.from({length:n}, (_,i)=> book.slice(0,2) + String(i+1).padStart(2,'0'));
  });
  return roster;
}
const ROSTER = buildRoster();

function pad(n){ return String(n).padStart(2,'0'); }
function monthKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function dateKey(d){ return monthKey(d) + '-' + pad(d.getDate()); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const now = new Date();
const MKEY = monthKey(now);
const DKEY = dateKey(now);

let tasksData = null;        // {floor: [{label, book}]}
let inspectorData = null;    // {book: name}
let checklistData = null;    // {"floor||label": "1"|"2"|"3"}
let submissions = null;      // {book: isoString}
let selectedBook = null;     // 目前選擇的書院

async function loadAll(){
  tasksData = DEFAULT_TASKS; // 打掃項目固定，不再由使用者新增/刪除
  inspectorData = await loadJSON('inspectors:'+MKEY, null);
  if(!inspectorData){
    inspectorData = {};
    BOOKS.forEach(book=>{ inspectorData[book] = pick(ROSTER[book]); });
    await saveJSON('inspectors:'+MKEY, inspectorData);
  }
  checklistData = await loadJSON('checklist:'+DKEY, {});
  submissions = await loadJSON('submissions:'+DKEY, {});
}

async function loadJSON(key, fallback){
  try{
    const res = await window.storage.get(key, true);
    return res ? JSON.parse(res.value) : fallback;
  }catch(e){
    return fallback;
  }
}
async function saveJSON(key, obj){
  try{
    await window.storage.set(key, JSON.stringify(obj), true);
  }catch(e){
    console.error('storage error', key, e);
  }
}

function taskId(floor, label){ return floor + '||' + label; }

function floorsForBook(book){
  return FLOOR_ORDER.filter(floor => tasksData[floor].some(item=>item.book===book));
}

function renderWhoBox(){
  const el = document.getElementById('who-box');
  if(!selectedBook){
    el.innerHTML = `
      <label for="book-select">請問您的書院為何？</label>
      <select id="book-select">
        <option value="">請選擇書院</option>
        ${BOOKS.map(b=>`<option value="${b}">${b}</option>`).join('')}
      </select>
    `;
    document.getElementById('book-select').addEventListener('change', (e)=>{
      if(e.target.value){
        selectedBook = e.target.value;
        render();
      }
    });
  }else{
    const floors = floorsForBook(selectedBook).join('、');
    el.innerHTML = `
      <div class="who-current">
        <div class="info">您的書院：<b>${selectedBook}</b>（負責 ${floors}）・本月清潔工：${inspectorData[selectedBook]}</div>
        <button class="swap-btn" id="swap-book-btn" type="button">更換書院</button>
      </div>
    `;
    document.getElementById('swap-book-btn').addEventListener('click', ()=>{
      selectedBook = null;
      render();
    });
  }
}

function render(){
  document.getElementById('today-label').textContent =
    now.toLocaleDateString('zh-TW', { month:'long', day:'numeric', weekday:'short' });

  renderWhoBox();

  // 本月清潔工總覽
  const stripEl = document.getElementById('roster-strip');
  stripEl.innerHTML = '';
  BOOKS.forEach(book=>{
    const chip = document.createElement('div');
    chip.className = 'roster-chip';
    chip.innerHTML = `<span class="swatch" style="background:${BOOK_COLOR[book]}"></span>
      <b>${book}</b><span class="who">${inspectorData[book]}</span>`;
    stripEl.appendChild(chip);
  });

  const floorsEl = document.getElementById('floors');
  const submitEl = document.getElementById('submit-area');
  floorsEl.innerHTML = '';

  if(!selectedBook){
    floorsEl.innerHTML = '<div class="empty-hint">請先選擇您的書院，才會顯示需要檢查的樓層與項目。</div>';
    submitEl.innerHTML = '';
    renderAdminSubmissions();
    return;
  }

  const alreadySubmitted = !!submissions[selectedBook];
  let totalTasks = 0, passCount = 0;

  floorsForBook(selectedBook).forEach(floor=>{
    const items = tasksData[floor].filter(item=>item.book===selectedBook);
    const doneCount = items.filter(item=>{
      const v = checklistData[taskId(floor,item.label)];
      return v === '1' || v === '2';
    }).length;
    totalTasks += items.length;
    passCount += doneCount;
    const pct = items.length ? Math.round(doneCount/items.length*100) : 0;

    const card = document.createElement('div');
    card.className = 'floor';

    card.innerHTML = `
      <div class="floor-head">
        <div class="floor-num">${floor}</div>
        <div class="floor-meta">
          <div class="tags">
            <span class="book-tag" style="background:${BOOK_COLOR[selectedBook]}"><span class="swatch"></span>${selectedBook}</span>
          </div>
          <div class="progress-line"><strong>${doneCount}</strong> / ${items.length} 項達到合格以上</div>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="task-list">
        ${items.map(item=>{
          const v = checklistData[taskId(floor,item.label)] || '';
          const levelClass = v ? 'level-'+v : '';
          return `<div class="task-row ${levelClass}" data-floor="${floor}" data-label="${item.label}">
            <div class="label">${item.label}</div>
            <select class="rate-select" ${alreadySubmitted?'disabled':''}>
              <option value="" ${v===''?'selected':''}>尚未檢查</option>
              ${RATINGS.map(r=>`<option value="${r.v}" ${v===r.v?'selected':''}>${r.label}</option>`).join('')}
            </select>
          </div>`;
        }).join('')}
      </div>
    `;
    floorsEl.appendChild(card);
  });

  // 下拉選單變更事件
  floorsEl.querySelectorAll('.task-row').forEach(row=>{
    row.querySelector('.rate-select').addEventListener('change', async (e)=>{
      const floor = row.dataset.floor, label = row.dataset.label;
      const id = taskId(floor, label);
      const val = e.target.value;
      if(val){ checklistData[id] = val; } else { delete checklistData[id]; }
      await saveJSON('checklist:'+DKEY, checklistData);
      render();
    });
  });

  // 繳交區塊
  const allDone = totalTasks > 0 && passCount === totalTasks;
  if(alreadySubmitted){
    const t = new Date(submissions[selectedBook]);
    submitEl.innerHTML = `<div class="submitted-banner">✓ ${selectedBook}今日打掃已於 ${pad(t.getHours())}:${pad(t.getMinutes())} 送出</div>`;
  }else{
    submitEl.innerHTML = `
      <div class="submit-box">
        <div class="hint">${allDone ? '全部項目都已達到合格以上，可以送出今日結果' : `還有 ${totalTasks-passCount} 項尚未達到「有一點灰塵，但大致清掃」以上，才能送出`}</div>
        <button class="submit-btn" id="submit-btn" ${allDone?'':'disabled'}>送出今日結果</button>
      </div>`;
    const btn = document.getElementById('submit-btn');
    if(btn){
      btn.addEventListener('click', async ()=>{
        submissions[selectedBook] = new Date().toISOString();
        await saveJSON('submissions:'+DKEY, submissions);
        render();
      });
    }
  }

  renderAdminSubmissions();
}

function renderAdminSubmissions(){
  const el = document.getElementById('admin-submissions');
  el.innerHTML = BOOKS.map(book=>{
    const sub = submissions[book];
    const status = sub ? `已於 ${pad(new Date(sub).getHours())}:${pad(new Date(sub).getMinutes())} 送出` : '尚未送出';
    return `<div class="admin-row">
      <span>${book}：${status}</span>
      ${sub ? `<button data-unsubmit="${book}" type="button">撤銷送出</button>` : ''}
    </div>`;
  }).join('');
  el.querySelectorAll('[data-unsubmit]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const book = btn.dataset.unsubmit;
      if(!confirm(`確定要撤銷 ${book} 今日的送出紀錄嗎？`)) return;
      delete submissions[book];
      await saveJSON('submissions:'+DKEY, submissions);
      render();
    });
  });
}

document.getElementById('reroll-btn').addEventListener('click', async ()=>{
  if(!confirm('確定要重新抽選本月清潔工嗎？這會覆蓋目前的名單。')) return;
  BOOKS.forEach(book=>{ inspectorData[book] = pick(ROSTER[book]); });
  await saveJSON('inspectors:'+MKEY, inspectorData);
  render();
});

(async function init(){
  document.getElementById('floors').innerHTML = '<div class="loading">載入中…</div>';
  await loadAll();
  render();
})();
</script>
</body>
</html>
